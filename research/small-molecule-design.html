// All visuals are explanatory schematics. No diagram encodes unreported experimental values.
const source='https://docs.google.com/document/d/1gkN85MXbnJsFgZAWe-ybes5iYbcFWLvHT58e_aqyOeE/edit';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function text(x,y,s,cls='',anchor='start'){return `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`}
function line(x1,y1,x2,y2,arrow=true){return `<path class="edge" d="M${x1} ${y1}L${x2} ${y2}" ${arrow?'marker-end="url(#arr)"':''}/>`}
function box(x,y,w,h,label,sub='',step=0){return `<g class="step" data-step="${step}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="#e8f3ef" stroke="#95beb6"/><rect class="highlight" x="${x}" y="${y}" width="6" height="${h}"/>${text(x+w/2,y+h/2+(sub?-5:8),label,'label','middle')}${sub?text(x+w/2,y+h/2+25,sub,'small','middle'):''}</g>`}
let diagramId=0;

function pocket(cx,cy,scale=1,color='#007e78',ligand=true){return `<g transform="translate(${cx} ${cy}) scale(${scale})"><path d="M-86-27C-108-67-61-109-26-87C4-123 51-99 58-73C105-78 116-31 89-8C65-2 43-24 22-20C-3-15-10 13 6 30C25 51 56 36 77 53C92 94 37 118 11 94C-25 118-64 102-65 79C-104 76-120 24-86-27Z" fill="${color}" fill-opacity=".14" stroke="${color}" stroke-width="2.5"/><path d="M-82-39C-40-69-39-27-63 2S-37 63-13 53M-15-81C16-58-8-38 17-22M42-70C70-45 46-32 72-15M-65 74C-39 37-23 87 18 72" fill="none" stroke="${color}" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/>${ligand?'<path d="M7 4L27-7L46 4L65-7M27-7L27-25M46 4L46 24" fill="none" stroke="#ce613c" stroke-width="4"/><circle cx="27" cy="-25" r="5" fill="#ce613c"/><circle cx="46" cy="24" r="5" fill="#ce613c"/>':''}</g>`}
function pmo(){return svg(text(135,42,'Hit generation','label','middle')+text(410,42,'Lead optimization','label','middle')+text(686,42,'Selective binding','label','middle')+pocket(112,177,.78)+pocket(389,177,.78)+pocket(611,152,.52)+pocket(739,232,.52,'#ce613c',false)+text(135,293,'Find molecules for a pocket','small','middle')+text(410,293,'Improve a seed molecule','small','middle')+text(595,87,'TYK2 JH2','small','middle')+text(750,315,'JAK1 off-target','small','middle')+line(647,182,707,210,false)+text(686,345,'Favor target over off-target','small','middle')+`<line x1="30" y1="367" x2="790" y2="367" stroke="#c8d9dc"/><rect x="30" y="390" width="325.6" height="50" fill="#007e78"/><rect x="355.6" y="390" width="414.4" height="50" fill="#183d50"/>`+text(192,423,'11 validation tasks','white label','middle')+text(563,423,'14 held-out test tasks','white label','middle')+text(410,480,'Tune on validation tasks, then evaluate transfer','small','middle'),'Protein-pocket schematics for hit generation, seed optimization, and selective binding to TYK2 JH2 over an off-target such as JAK1')}
function scaling(){const rows=[['Property prediction','Inconsistent gains','#ce613c'],['Conditioned generation','Generally improves','#007e78'],['Docking optimization','Depends on the task','#183d50'],['Selective binding','Clearest larger-model benefit','#007e78']];return svg(text(30,43,'Molecular LLM size','label')+['170M','380M','1.3B','3B'].map((s,i)=>text(60+i*220,110,s,'label')).join('')+line(60,147,757,147)+text(410,181,'Larger models','small','middle')+rows.map((r,i)=>`<line x1="30" y1="${215+i*65}" x2="780" y2="${215+i*65}" stroke="#c8d9dc"/>`+text(30,254+i*65,r[0])+`<text x="365" y="${254+i*65}" style="fill:${r[2]}" font-weight="700">${r[1]}</text>`).join(''),'Qualitative scaling findings by task, with model sizes from 170 million to 3 billion parameters')}
function selftrain(){return svg(box(25,65,210,90,'Model M₁','Molecular generator',0)+line(235,110,280,110)+box(290,65,240,90,'Scored search','Candidate campaigns',1)+line(530,110,575,110)+box(585,65,210,90,'Curated chains','Improvement paths',2)+`<path class="edge" marker-end="url(#arr)" d="M690 155V230H130V305"/>`+box(25,315,210,90,'Model M₂','Train on those chains',3)+line(235,360,280,360)+box(290,315,240,90,'New search data','Next self-training round',4)+line(530,360,575,360)+box(585,315,210,90,'Next model','Repeat and evaluate',5)+text(410,265,'Transfer search ability into model weights','accent label','middle')+text(410,467,'Compare minimal feedback with elite-pool search','small','middle'),'Iterative self-training curates improvement chains from search and trains successive molecular generators')}
function conformer(){return svg(text(30,45,'Discrete tokens for 3D molecular geometry','label')+atoms(77,163,1.1)+text(120,292,'3D conformer','small','middle')+line(225,199,290,199)+box(300,145,215,100,'Learned tokenizer','CoordToken',0)+line(515,199,570,199)+text(687,178,'[t₁] [t₂] [t₃]','accent label','middle')+text(687,217,'[t₄] [t₅] …','accent label','middle')+text(687,269,'Discrete token sequence','small','middle')+`<path class="edge" marker-end="url(#arr)" d="M687 290V337H410V369"/>`+text(410,414,'Autoregressive generation and geometry refinement','label','middle')+text(30,476,'~91M molecules','accent label')+text(455,476,'~190M conformers','accent label'),'CoordToken maps 3D molecular geometry into discrete tokens used for generation and refinement')}
function pharm(){return svg(text(30,44,'Compose the conditions for a new molecule','label')+`<g class="step" data-step="0"><circle cx="500" cy="206" r="82" fill="#def1e7" stroke="#007e78" stroke-width="2" stroke-dasharray="7 6"/>${text(500,110,'Required interaction region','small','middle')}</g><g class="step" data-step="1"><circle cx="684" cy="333" r="83" fill="#fff0e7" stroke="#ce613c" stroke-width="2" stroke-dasharray="7 6"/>${text(686,447,'Excluded region','small','middle')}</g><g class="step" data-step="2">${atoms(298,213,1.1)}<circle cx="298" cy="213" r="16" fill="none" stroke="#183d50" stroke-width="2"/><circle cx="386" cy="263" r="16" fill="none" stroke="#183d50" stroke-width="2"/>${text(260,347,'Fixed fragment / coordinates','small','middle')}</g><path d="M427 190L475 160L515 194L544 177" fill="none" stroke="#007e78" stroke-width="4"/><circle cx="515" cy="194" r="8" fill="#007e78"/>`+text(34,140,'Fragment constraints')+text(34,182,'Coordinate constraints')+text(34,224,'Interaction patterns')+text(410,494,'Generate structure while satisfying the combined conditions','small','middle'),'Schematic constraint interface combining fixed fragments, coordinates, required interactions, and excluded spatial regions')}
function toxicity(){return svg(box(240,40,330,85,'Candidate molecules','Generated or modified',0)+line(405,125,405,176)+box(240,186,330,85,'Toxicity feedback','Toxometris.ai case study',1)+`<path class="edge" d="M405 271V320H168V355M405 320H643V355" marker-end="url(#arr)"/>`+text(168,402,'Revise candidates','label','middle')+text(643,402,'Retain candidates','label','middle')+`<path class="edge" d="M168 420V460H58V82H230" marker-end="url(#arr)"/>`+text(410,493,'Use external feedback to guide the next proposals','small','middle'),'Conceptual toxicity feedback loop for an ongoing applied molecular optimization case study')}
// CASF data: casf-benchmark-paper, commit 77106df7aa3535c71caad618a2f46c02b689bf68,
// jcim-overleaf/tables/recovery.tex and sampling-data/endpoints.csv (core94).
// Docking data: archived Sim2Sci submission, Sections 3–4 and Figure 2.
const casfRecovery=[['Torsion minimized',68.1,79.8],['RDKit minimized',70.2,78.7],['Torsion raw',66.0,78.7],['RDKit raw',66.0,80.9],['FlowR',70.2,86.2],['NExT-Mol DMT-L',76.6,86.2],['Torsional Diffusion',73.4,89.4],['MCF drugs-L',71.3,86.2],['LoQI',74.5,86.2],['Qwen 1.7B FSQ',80.9,91.5]];
function casfResults(){const x=v=>290+(v-60)*12;let g=text(410,28,'Bioactive-conformer recovery on 94 CASF entries','label','middle');for(const v of [60,70,80,90,100])g+=`<line x1="${x(v)}" y1="60" x2="${x(v)}" y2="390" stroke="#d6e2e2"/>`+text(x(v),418,String(v),'small','middle');casfRecovery.forEach(([name,a,b],i)=>{const y=76+i*33;g+=text(15,y+6,name,'small')+`<line x1="${x(a)}" y1="${y}" x2="${x(b)}" y2="${y}" stroke="#87a7aa" stroke-width="3"/><circle cx="${x(a)}" cy="${y}" r="6" fill="#f8fbfa" stroke="#6b838c" stroke-width="2"/><circle cx="${x(b)}" cy="${y}" r="6" fill="#007e78"/>`+text(x(a)-12,y+6,a.toFixed(1),'small','end')+text(x(b)+12,y+6,b.toFixed(1),'small')});g+=text(530,446,'Hit@0.75 (%) · higher is better','small','middle')+`<circle cx="35" cy="482" r="6" fill="#f8fbfa" stroke="#6b838c" stroke-width="2"/>`+text(50,488,'ChEMBL-count target','small')+`<circle cx="420" cy="482" r="6" fill="#007e78"/>`+text(435,488,'1,000-candidate target','small');return svg(g,'Hit at 0.75 angstrom on 94 CASF entries for all ten generation pipelines at the ChEMBL-count and one-thousand-candidate targets')}
const dockingRecovery=[['Crystal',81.6,78.6,'#183d50'],['Qwen 1.7B-FSQ',79.9,76.6,'#007e78'],['ETKDGv3 + MMFF',77.3,71.4,'#78949c'],['LoQI',66.1,63.5,'#ce613c']];
function dockingResults(){let g=text(410,28,'Vina-GPU: best-of-10 success at RMSD < 2 Å','label','middle')+text(330,76,'Runs N’ Poses','label','middle')+text(635,76,'CASF-2016','label','middle');for(const [left] of [[220],[525]]){for(const v of [0,50,100])g+=`<line x1="${left+v*2.25}" y1="91" x2="${left+v*2.25}" y2="335" stroke="#d6e2e2"/>`+text(left+v*2.25,362,String(v),'small','middle')}dockingRecovery.forEach(([name,a,b,c],i)=>{const y=111+i*57;g+=text(12,y+17,name,'small');for(const [left,v] of [[220,a],[525,b]])g+=`<rect x="${left}" y="${y}" width="${v*2.25}" height="22" fill="${c}"/>`+text(left+v*2.25+8,y+18,v.toFixed(1),'small')});g+=text(480,390,'Success (%) · higher is better','small','middle')+`<line x1="10" y1="413" x2="800" y2="413" stroke="#c8d9dc"/>`+text(10,445,'RNP control, same ten-attempt budget','label')+text(10,481,'One conformer: Qwen 66.9 = MMFF 66.9','small')+text(460,481,'Ten conformers: 79.9 vs 77.3','small');return svg(g,'Best-of-ten Vina-GPU docking success on Runs N Poses and CASF-2016 for crystal, Qwen, classical MMFF, and LoQI initialization, plus fixed-conformer RNP control')}
const slides=[
{year:'2024',title:'BARTSmiles',lead:'Molecular representations learned from 1.7 billion SMILES.',body:'A BART-like encoder–decoder learns to reconstruct molecular strings. Fine-tuning yields competitive results for property prediction, chemical reactions and retrosynthesis.',status:'Joint work with Meta AI. Published in JCIM.',visual:bart,caption:'Masked-language-model pretraining and downstream adaptation. Method schematic.',links:[['Paper','https://pubs.acs.org/doi/full/10.1021/acs.jcim.4c00512']]},
{year:'2024–2026',title:'Small Molecule Optimization with LLMs',lead:'Chemlactica and Chemma propose molecules inside an evolutionary search loop.',body:'Models up to <strong>2B parameters</strong> reach state-of-the-art results in most PMO settings. Multi-seed experiments compare task-agnostic and task-informed evaluation.',status:'NeurIPS 2024 workshop. Revised manuscript under review at the Journal of Cheminformatics.',visual:chemlactica,caption:'The language model proposes candidates. External evaluators provide feedback. Press Space to follow the loop.',links:[['Preprint','https://arxiv.org/abs/2407.18897'],['Models','https://huggingface.co/collections/yerevann/small-molecule-optimization-with-llms']]},
{year:'2026',title:'PMO-Dock',lead:'A common benchmark for docking optimization and generalization.',body:'<strong>25 tasks</strong> span hit generation, lead optimization and selective binding. Separate development and test tasks reveal whether hyperparameters transfer across targets.',status:'Joint work with UCSD. ICLR 2026 GEM and NeurIPS 2026 accepted.',visual:pmo,caption:'Protein and pocket schematics. Orange denotes a candidate ligand. Methods: Saturn, GenMol, Genetic-guided GFlowNet and Chemlactica.',links:[]},
{year:'2025–2026 · ongoing',title:'Downstream Transfer of Scaling',lead:'The benefit of larger molecular LLMs depends on the downstream task.',body:'We compare <strong>170M to 3B</strong> models on property prediction, conditioned generation and docking optimization. Selective binding shows the clearest advantage for larger models.',status:'ICLR 2025 GEM. NeurIPS 2026 AI for Drug Discovery accepted. Journal extension ongoing.',visual:scaling,caption:'Qualitative findings from the study. The diagram shows task-dependent behavior, rather than numerical scaling curves.',links:[['Workshop paper','https://openreview.net/forum?id=z1std0xveB']]},
{year:'2026 · ongoing',title:'Learning Molecular Optimization from Search',lead:'Can self-training move optimization ability into the model?',body:'Scored improvement chains come from evolutionary search. Updated models generate data for subsequent training. We compare minimal feedback with elite-pool search and test transfer to unseen protein targets.',status:'Ongoing research on iterative self-training for molecular optimization.',visual:selftrain,caption:'Chains are curated improvement paths from scored campaigns. They need not follow the chronological order of search.',links:[]},
{year:'2025–2026 · ongoing',title:'Conformer Generation and 3D Tokenization',lead:'CoordToken represents molecular geometry as a discrete sequence.',body:'Initial experiments improve generation precision over fixed coordinate bins. Current work studies large-scale pretraining, matched tokenizer comparisons and recovery of bioactive poses.',status:'CoordToken accepted at ICLR 2026 FM4Science and NeurIPS 2026 ML4Molecules and AI for Drug Discovery.',visual:conformer,caption:'Schematic geometry and token sequence. Generation coverage remains a focus, alongside physical plausibility and conformer diversity.',links:[['CoordToken','https://openreview.net/forum?id=VYRidQUY2s']]},
{year:'2026 · working manuscript',title:'Recovery of Bioactive Conformations',lead:'More candidates improve recovery of experimentally observed ligand geometries.',body:'Across ten generators, Qwen reaches <strong>91.5% Hit@0.75</strong> at the 1,000-candidate target. Its mean per-entry best RMSD is <strong>0.307 Å</strong>. Rankings depend on tolerance: at 0.5 Å, LoQI recovers 83.0% versus Qwen’s 78.7%.',status:'CASF core94 benchmark. Initial Qwen checkpoint. Benchmark-excluded evaluation remains pending.',visual:casfResults,caption:'Hit@0.75: at least one retained conformer within 0.75 Å of the bound reference. All 94 entries, failures included. Candidate targets precede filtering and do not match compute cost.',links:[['Manuscript and data','https://github.com/YerevaNN/casf-benchmark-paper'],['Recovery table','https://github.com/YerevaNN/casf-benchmark-paper/blob/77106df7aa3535c71caad618a2f46c02b689bf68/jcim-overleaf/tables/recovery.tex']]},
{year:'2026 · workshop submission',title:'Starting Geometry and Docking Recovery',lead:'Multiple Qwen conformers narrow the gap to crystal-initialized docking.',body:'Under ten docking attempts, Qwen exceeds the classical pipeline by <strong>2.6 percentage points on RNP</strong> and <strong>5.2 on CASF</strong>. Reusing one conformer removes the RNP advantage. Best-of-ten recovery does not establish selection of the correct final pose.',status:'Sim2Sci submission (rejected). Reported point estimates lack paired uncertainty intervals.',visual:dockingResults,caption:'Submitted paper, Section 3 values. Crystal uses ten seeds; generated methods use ten conformers. RNP: Qwen n=1,343, other methods n=1,346. Detailed comparison uses Vina-GPU.',links:[['Submission and reviews','https://openreview.net/forum?id=RPXD8NpvzT'],['Paper','https://openreview.net/pdf?id=RPXD8NpvzT']]},
{year:'2026 · ongoing',title:'Pharmacophore-Conditioned 3D Generation',lead:'One generator for combinations of molecular and spatial constraints.',body:'Preserve required substructures, grow or connect fragments, and satisfy desired interaction patterns while avoiding excluded regions. We are developing the interface, training tasks and constraint-satisfaction evaluation.',status:'Ongoing work. Constraint satisfaction, validity and novelty guide evaluation.',visual:pharm,caption:'Conceptual spatial constraints, not a simulated binding pose or a validated molecule.',links:[]},
{year:'Ongoing',title:'Molecular Toxicity Optimization',lead:'An applied case study with Toxometris.ai.',body:'Molecular optimization uses toxicity feedback to guide proposals. The aim is to bring our optimization methods closer to practical drug-design constraints.',status:'Ongoing applied research.',visual:toxicity,caption:'Conceptual feedback loop. No experimental efficacy or toxicity reduction is claimed in this diagram.',links:[]}
];

deck.innerHTML=slides.map((s,i)=>`<section class="slide" id="slide-${i+1}" aria-label="${i+1}. ${esc(s.title)}"><div class="top"><span>${esc(s.year)}</span><span class="brand">YerevaNN</span></div><h1>${esc(s.title)}</h1><div class="main"><div class="copy"><p class="lead">${esc(s.lead)}</p><p>${s.body}</p><p class="status">${esc(s.status)}</p></div><div class="visual">${s.visual()}<p class="caption">${esc(s.caption)}</p></div></div><footer class="footer"><div class="links"><a href="${source}" target="_blank" rel="noopener">Research summary</a>${s.links.map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`).join('')}</div><span class="number">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></footer></section>`).join('');
let current=0,timer=null,phase=0;const nodes=[...document.querySelectorAll('.slide')];const overview=document.getElementById('overview');
function stop(){clearInterval(timer);timer=null;nodes.forEach(n=>n.classList.remove('playing'));document.getElementById('animate').textContent='Play diagram'}
function show(i){stop();current=Math.max(0,Math.min(slides.length-1,i));nodes.forEach((n,j)=>{n.classList.toggle('active',j===current);n.setAttribute('aria-hidden',String(j!==current))});document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('animate').disabled=!nodes[current].querySelector('.step');history.replaceState(null,'','#'+(current+1));document.title=slides[current].title+' · YerevaNN'}
function play(){if(timer){stop();return}const groups=[...nodes[current].querySelectorAll('.step')];if(!groups.length)return;phase=0;nodes[current].classList.add('playing');const tick=()=>{groups.forEach((g,j)=>g.classList.toggle('lit',j===phase));phase=(phase+1)%groups.length};tick();timer=setInterval(tick,1250);document.getElementById('animate').textContent='Pause diagram'}
function fit(){deck.style.transform=`scale(${Math.min(innerWidth/1600,(innerHeight-48)/900)})`}
function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('animate').onclick=play;document.getElementById('full').onclick=full;document.getElementById('index').onclick=()=>overview.classList.toggle('open');
document.getElementById('contents').innerHTML=slides.map((s,i)=>`<button data-index="${i}">${String(i+1).padStart(2,'0')} &nbsp; ${esc(s.title)}</button>`).join('');document.getElementById('contents').onclick=e=>{const b=e.target.closest('button');if(b){show(Number(b.dataset.index));overview.classList.remove('open')}};
document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input,textarea')&&e.key===' ')return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)||['ArrowLeft','ArrowUp','PageUp'].includes(e.key))e.preventDefault();if(e.key==='Escape')overview.classList.remove('open');if(overview.classList.contains('open'))return;if(['ArrowRight','ArrowDown','PageDown'].includes(e.key))show(current+1);if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))show(current-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='o')overview.classList.add('open');if(e.key===' ')play()});
let startX=0;document.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1))},{passive:true});
window.addEventListener('resize',fit);show((Number(location.hash.slice(1))||1)-1);fit();
</script></body></html>
